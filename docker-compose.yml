services:
  # --- KAFKA SUBSYSTEM (KRaft Mode) ---
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CLUSTER_ID=L622_qE_Tnu9H_fR4H9M7w
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    ports:
      - "8083:8083"
    volumes:
      - ./connect_plugins:/usr/share/java/kafka-connect-plugins
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=retail-connect-group
      - CONFIG_STORAGE_TOPIC=connect-configs
      - OFFSET_STORAGE_TOPIC=connect-offsets
      - STATUS_STORAGE_TOPIC=connect-status
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=1
      - AWS_ACCESS_KEY_ID=${KAFKA_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${KAFKA_AWS_SECRET_ACCESS_KEY}
      - CONNECT_PLUGIN_PATH=/usr/share/java,/usr/share/kafka/plugins,/usr/share/java/kafka-connect-plugins
      # Fixes ClassLoader isolation NPE bug for S3 Partitioners
      - CLASSPATH=/usr/share/java/kafka-connect-plugins/confluentinc-kafka-connect-s3/lib/*
    command:
      - /bin/bash
      - -c
      - |
        echo "==> Installing Amazon S3 Sink Connector..."
        mkdir -p /usr/share/java/kafka-connect-plugins/confluentinc-kafka-connect-s3
        curl -sO https://packages.confluent.io/maven/io/confluent/kafka-connect-s3/10.6.18/kafka-connect-s3-10.6.18.zip
        unzip -o kafka-connect-s3-10.6.18.zip -d /tmp/
        cp -r /tmp/kafka-connect-s3-10.6.18/* /usr/share/java/kafka-connect-plugins/confluentinc-kafka-connect-s3/
        rm -rf kafka-connect-s3-10.6.18.zip /tmp/kafka-connect-s3-10.6.18
        echo "==> Plugin installation complete. Starting Kafka Connect process..."
        /docker-entrypoint.sh start
    depends_on:
      - kafka

  # --- DATABASE SUBSYSTEM (CDC Enabled) ---
  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=retail_db
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d retail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- AIRFLOW 3.x SUBSYSTEM ---
  airflow-db:
    image: postgres:18
    container_name: airflow-db
    volumes:
      - ./airflow_db_data:/var/lib/postgresql/
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-api-server:
    image: apache/airflow:3.2.1
    container_name: airflow-api-server
    restart: always
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__FAB__AUTO_CREATE_ADMIN_USER=True
      - AIRFLOW__FAB__ADMIN_USER_USERNAME=admin
      - AIRFLOW__FAB__ADMIN_USER_PASSWORD=admin
      - AIRFLOW__FAB__ADMIN_USER_EMAIL=kanojiamohit07@gmail.com
    ports:
      - "8080:8080"
    command: api-server

  airflow-scheduler:
    image: apache/airflow:3.2.1
    container_name: airflow-scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    command: scheduler

# ROOT VOLUME DEFINITIONS (Fixes "undefined volume kafka_data")
volumes:
  kafka_data: